name: Katabump Auto Renew

on:
  schedule:
    # 激活时间窗口：UTC第一天12:39——第二天12:39 | 北京时间第一天20:39——第二天20:39
    # 每天 UTC 12:52 (北京时间 20:52) 运行，每天跑一次，提供最高容错率
    # 彻底避开整点运行的高峰期，降低 Cloudflare 拦截概率
    - cron: '52 12 * * *' 
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        # 提前获取出口 IP 并通知 GitHub Actions 进行日志脱敏 (将 IP 隐藏为 ***)
        # 优先尝试通过本地代理获取 IP，如果代理未开启则获取直连 IP
        EXPORT_IP=$(curl -s --socks5-hostname 127.0.0.1:1080 https://api.ipify.org || curl -s https://api.ipify.org)
        
        # 验证获取到的内容是否为合法的 IP 格式，防止获取失败导致全局掩码
        if [[ $EXPORT_IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::add-mask::$EXPORT_IP"
        fi
        
        # 运行主程序 (原有代码保持不变)
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
